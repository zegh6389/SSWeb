<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSWeb Setup 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>VPN Setup</h1>
    <p>Choose your server details to continue.</p>
    <form id="setup-form">
      <label>Server <input name="server" required placeholder="vpn.example.com"></label>
      <label>Port <input name="port" type="number" value="1194" required></label>
      <button type="submit">Continue</button>
    </form>
  </main>
  <script src="script-enhanced.js"></script>
</body>
</html>
